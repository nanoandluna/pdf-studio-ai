name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Audit npm runtime dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - name: Real Electron smoke test
        if: runner.os == 'Windows'
        run: npm run test:smoke
      - name: Verify Windows portable packaging
        if: runner.os == 'Windows'
        run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: windows-portable
          path: release/**/*.exe
          if-no-files-found: error
          retention-days: 7
